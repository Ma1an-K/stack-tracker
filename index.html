  <body>

    <noscript>
      <main style="max-width:760px;margin:40px auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;color:#ede8d8;background:#0a0d18;">
        <h1>Stack Tracker — Poker Homegame Manager</h1>
        <p>
          Stack Tracker is a free web app for managing private poker homegames.
          Log every session, track buy-ins and cash-outs, and get automatic
          settlement calculations so nobody owes the wrong amount.
        </p>

        <h2>Features</h2>
        <ul>
          <li><strong>Session tracker</strong> — log buy-ins, rebuys and cash-outs for every home poker night.</li>
          <li><strong>Automatic settlement calculator</strong> — works out who pays whom in the fewest possible transfers.</li>
          <li><strong>Leaderboards and standings</strong> — ranked by profit, ROI and sessions played.</li>
          <li><strong>Personal poker stats</strong> — lifetime profit, per-session averages, biggest wins and losses.</li>
          <li><strong>Badges and achievements</strong> — heaters, cold streaks, tournament wins and more.</li>
          <li><strong>Private homegames</strong> — invite-only, with shareable codes and role-based access.</li>
          <li><strong>Installable PWA</strong> — add to your iPhone or Android home screen for a native-app feel.</li>
        </ul>

        <h2>How it works</h2>
        <ol>
          <li><strong>Create a homegame.</strong> Name your poker night, pick an icon, and you're ready. Free forever, no card required.</li>
          <li><strong>Invite your players.</strong> Share an invite code with your regulars. They sign up, join your game, and appear on the leaderboard.</li>
          <li><strong>Log sessions, settle debts.</strong> After the game, enter buy-ins and cash-outs. Stack Tracker calculates who pays whom — instantly.</li>
        </ol>

        <h2>Frequently asked questions</h2>
        <h3>Is Stack Tracker free?</h3>
        <p>Yes — Stack Tracker is completely free for players and homegame owners. No subscriptions, no ads, no card required.</p>
        <h3>Do I need to install anything?</h3>
        <p>No. It works in any modern browser on iPhone, Android, Mac or PC. You can optionally install it as a PWA on your home screen for a full-screen, app-like experience.</p>
        <h3>How does the settlement calculator work?</h3>
        <p>After a session, enter each player's total buy-ins and final stack. Stack Tracker figures out who owes whom with the minimum number of transfers — so instead of six people paying six others, you might only need two payments to settle everything.</p>
        <h3>Can I run multiple homegames?</h3>
        <p>Absolutely. Each homegame has its own members, sessions, leaderboard and stats. Switch between them from the header menu.</p>
        <h3>Is my data private?</h3>
        <p>Yes. Homegames are invite-only — only the people with your invite code can see the sessions, standings and settlements for your private poker game.</p>

        <p style="margin-top:32px;">Please enable JavaScript to use Stack Tracker.</p>
      </main>
